services:
  rw10plus:
    build: .
    container_name: rw10plus-v03
    restart: unless-stopped
    ports:
      - "8188:8000"
    environment:
      TZ: Asia/Jakarta
      RW10_PORT: "8000"
      RW10_DB_PATH: /app/data/rw10.db
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

  rw10plus-website:
    image: nginx:1.27-alpine
    container_name: rw10plus-website
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25

  rw10plus-cms:
    build: ./cms
    container_name: rw10plus-cms
    restart: unless-stopped
    environment:
      CMS_PORT: "8090"
      CMS_DATA_DIR: /data
      # TEMPORARY bootstrap credentials so CI/deploy can start without .env.
      # Change these after the first successful deployment.
      CMS_ADMIN_PASSWORD: "RW10Admin2026!"
      CMS_COOKIE_SECURE: "false"
    volumes:
      - ./cms-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
