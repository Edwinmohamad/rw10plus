name: Build RW10+ Internal APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-client/**"
      - ".github/workflows/build-internal-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build internal debug APK
        run: gradle --no-daemon clean lintDebug assembleDebug -PRW10_SERVER_URL=http://192.168.100.50:8188/
      - name: Rename artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk RW10PLUS-INTERNAL-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RW10PLUS-INTERNAL-v0.3.0
          path: android-client/RW10PLUS-INTERNAL-v0.3.0.apk
          if-no-files-found: error
          retention-days: 30
