name: Build RW10+ Internal APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rw10plus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-client

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify and install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager)"
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run lint and build debug APK
        run: |
          gradle --no-daemon --stacktrace clean lintDebug assembleDebug -PRW10_SERVER_URL=http://192.168.100.50:8188/

      - name: Prepare APK artifact
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk RW10PLUS-INTERNAL-v0.3.0.apk*
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RW10PLUS-INTERNAL-v0.3.0-${{ github.run_number }}
          path: android-client/RW10PLUS-INTERNAL-v0.3.0.apk
          if-no-files-found: error
          retention-days: 30
