name: Deploy RW10+ to CT102

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server.py"
      - "static/**"
      - "website/**"
      - "Dockerfile"
      - "compose.yaml"
      - "install.sh"
      - "tests/**"
      - ".github/workflows/deploy-ct102.yml"

permissions:
  contents: read

concurrency:
  group: rw10plus-deploy-ct102
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on local CT102 runner
    runs-on:
      - self-hosted
      - rw10plus-deploy
    timeout-minutes: 20

    steps:
      - name: Prepare runner workspace
        run: |
          sudo mkdir -p "$GITHUB_WORKSPACE"
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Validate Docker compose
        run: docker compose --project-directory "$GITHUB_WORKSPACE" -f "$GITHUB_WORKSPACE/compose.yaml" config --quiet

      - name: Deploy RW10+
        run: sudo bash "$GITHUB_WORKSPACE/install.sh"

      - name: Show containers
        if: always()
        run: docker compose --project-directory "$GITHUB_WORKSPACE" -f "$GITHUB_WORKSPACE/compose.yaml" ps
