server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /content-api/ {
    proxy_pass http://rw10plus-cms:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 6m;
  }
  location / { try_files $uri $uri/ =404; }
}
